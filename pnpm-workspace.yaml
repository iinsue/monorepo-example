# pnpm-workspace.yaml

# 1. 모노레포(Workspace)에 포함할 패키지(하위 프로젝트) 경로 목록
packages:
  # apps 폴더 직하위의 모든 디렉토리를 개별 프로젝트(예: 웹 앱, API 서버, 어드민 등)로 인식
  - "apps/*"
  # packages 폴더 직하위의 모든 디렉토리를 공유 패키지(예: 공통 UI, 유틸, 공통 tsconfig 등)로 인식
  - "packages/*"

# 2. 패키지 설치 시 라이프사이클 스크립트(postinstall, build 등)의 실행 허용 여부 설정
#    보안(악성 스크립트 차단) 및 설치 속도 최적화를 위해 신뢰하는 빌드 스크립트만 선택적으로 허용합니다.
allowBuilds:
  pnpm: true # pnpm 관련 스크립트 실행 허용
  esbuild: true # esbuild 설치 시 플랫폼별 네이티브 바이너리 셋업 스크립트 실행 허용
  protobufjs: true # protobufjs의 설치/빌드 스크립트 실행 허용
  sharp: false # sharp(이미지 처리)의 빌드 스크립트 실행 차단 (사전 빌드 바이너리 사용 또는 불필요한 컴파일 방지)
  unrs-resolver: false # unrs-resolver 패키지의 빌드 스크립트 실행 차단
